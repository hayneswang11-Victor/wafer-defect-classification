[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer-defect-classification"
version = "0.1.1"
description = "Synthetic wafer map and DRAM fail bit map defect classification prototype."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Local Prototype" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing"
]
dependencies = [
  "numpy==2.5.1",
  "pandas==3.0.5",
  "scipy==1.18.0",
  "scikit-learn==1.9.0",
  "scikit-image==0.26.0",
  "pillow==12.3.0",
  "matplotlib==3.11.1",
  "tqdm==4.70.0",
  "pyyaml==6.0.3",
  "joblib==1.5.3",
  "rich==15.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1"
]

[project.scripts]
wafer-defects = "wafer_defect_classification.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
